# Builds and deploys the documentation site (website/ -> the catena-docs
# Cloudflare Pages project, served at https://catena.nerdmenot.in).
#
# ## What gets published, and when
#
# Only a released tag is ever deployed. The site states the version it
# documents, and its content is derived from the tree it is built from, so
# publishing main would put the header and the content in disagreement the
# moment anything lands unreleased — a reader following the site would be
# told about operators `go get` cannot give them.
#
# So a push to main builds the site and runs every check against it, and
# stops there. Deployment happens on a published release, or on a manual
# dispatch, and both build the *tag*, never the branch.
#
# ## Why this job does not run `bun run build`
#
# That script is `bun run sync && astro build`, and `sync` derives the
# guides, examples and version from the repository. Running it here would
# mean the deployed site could differ from what was reviewed in the pull
# request — the generated pages would be produced fresh, unseen.
#
# So the generated content is committed, CI fails when it is stale (see
# "Website content is current" in ci.yml), and this job builds exactly
# those reviewed files.
#
# ## Secrets
#
# CLOUDFLARE_API_TOKEN   — scoped to Cloudflare Pages: Edit on this account.
# CLOUDFLARE_ACCOUNT_ID  — the account the catena-docs project lives in.
#
# Neither is available to a fork's pull request, which is why deploy is
# guarded on push and dispatch rather than on pull_request.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'examples/**'
      - 'CHANGELOG.md'
      - 'version.go'
      - '.github/workflows/docs.yml'
  # The site states which release it documents, and that comes from the
  # changelog — so publishing a release must republish the site even when
  # nothing under website/ changed. This covers a release published by
  # hand; the Release workflow creates its release with GITHUB_TOKEN,
  # which raises no `release` event, so that path dispatches this
  # workflow explicitly instead, passing the tag it just published.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to publish (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: read

env:
  # Resolved once, in the first step: the ref whose tree gets built and
  # published. Empty on a push to main, which is the signal not to deploy.
  PUBLISH_REF: ''

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Surfaced as env so the deploy step can test for them. Secrets cannot
    # be read in a job-level `if`, and a repository without them
    # configured should skip the deploy rather than fail the workflow —
    # the build and its checks above are the part worth running always.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: website
    steps:
      # A dispatch with no ref republishes the current release, which is
      # the recovery path when a deploy fails or the site drifts. A branch
      # may be named instead, for a change to the site itself rather than
      # to the library's documentation — the guard below is what keeps that
      # honest, so it is not a way around the rule.
      - name: Resolve the ref to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            release)  ref='${{ github.event.release.tag_name }}' ;;
            workflow_dispatch)
              ref='${{ inputs.ref }}'
              if [ -z "$ref" ]; then
                ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
              fi
              ;;
            *) ref='' ;;   # push to main: build and check only
          esac
          echo "PUBLISH_REF=$ref" >> "$GITHUB_ENV"
          if [ -n "$ref" ]; then
            echo "::notice::building $ref for deployment"
          else
            echo "::notice::building main for checks only — no deploy"
          fi
        working-directory: .

      # The ref being published when there is one; otherwise the pushed
      # commit, for checks. Full history so the guard below can diff
      # against the release tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH_REF || github.sha }}
          fetch-depth: 0

      # The invariant the whole tag-only rule exists to protect: the
      # operator reference is generated from the library's own doc comments
      # and verified examples, so if it differs from the released tag, this
      # build would document API that `go get` cannot deliver. Publishing a
      # tag satisfies it trivially; publishing a branch satisfies it only
      # while the library is untouched, which is exactly when a site-only
      # change is safe to ship ahead of a release.
      - name: The operator reference matches the released module
        if: env.PUBLISH_REF != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          git fetch --quiet --no-tags origin "refs/tags/$latest:refs/tags/$latest" 2>/dev/null || true
          if git diff --quiet "$latest" HEAD -- docs/operators; then
            echo "::notice::operator reference matches $latest"
          else
            echo "::error::the operator reference differs from $latest, so this build" \
                 "would document API the released module does not have. Cut a release" \
                 "instead of publishing this ref."
            git diff --stat "$latest" HEAD -- docs/operators
            exit 1
          fi
        working-directory: .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # `astro build` alone, deliberately — see the note at the top.
      - run: bun run astro build

      # A build that emits nothing still deploys successfully and replaces
      # a working site with an empty one, so the output is checked before
      # it is published rather than after somebody notices.
      - name: Output is not empty
        run: |
          test -f dist/index.html || {
            echo "::error::dist/index.html is missing — the build produced no site."
            exit 1
          }
          pages=$(find dist -name '*.html' | wc -l)
          echo "built $pages pages"
          [ "$pages" -ge 15 ] || {
            echo "::error::only $pages pages built, expected the full docs tree."
            exit 1
          }

      # The version in the header is the site's main factual claim. If it
      # does not match the newest changelog entry, the deploy would tell
      # readers to use a version that is not the current release.
      - name: Site version matches the newest release
        run: |
          want=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' ../CHANGELOG.md | tr -d '## []')
          have=$(python3 -c "import json;print(json.load(open('src/data/site.json'))['version'])")
          echo "changelog: $want, site: $have"
          [ "$want" = "$have" ] || {
            echo "::error::site.json says v$have but the newest release is v$want — run 'bun run sync'."
            exit 1
          }

      # Created on first deploy rather than by hand in the dashboard, so a
      # fresh clone needs only the two secrets to publish. Idempotent: the
      # project is created only when the account does not already have it.
      - name: Ensure the Pages project exists
        if: env.CLOUDFLARE_API_TOKEN != '' && env.PUBLISH_REF != ''
        run: |
          if bunx wrangler pages project list 2>/dev/null | grep -q 'catena-docs'; then
            echo "project catena-docs already exists"
          else
            echo "creating Pages project catena-docs"
            bunx wrangler pages project create catena-docs --production-branch=main
          fi

      # --branch is not optional here. Wrangler otherwise infers the branch
      # from git, and a tag is checked out detached, so it infers "HEAD" and
      # publishes a *preview* at head.catena-docs.pages.dev while production
      # keeps serving whatever was deployed last. Naming the project's
      # production branch is what makes a tag build land on the live site.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.PUBLISH_REF != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=catena-docs --branch=main

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.PUBLISH_REF == ''
        run: |
          if [ -z "$PUBLISH_REF" ]; then
            echo "::notice::Site built and checked. Not deployed: a push to main" \
                 "never publishes, so unreleased content cannot reach the site." \
                 "It goes live when you cut a release." 
          else
            echo "::notice::Site built and checked, but not deployed:" \
                 "CLOUDFLARE_API_TOKEN is not configured for this repository." \
                 "Create the catena-docs Pages project and add the secret to enable it."
          fi
